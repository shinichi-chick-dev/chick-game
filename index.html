<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひよこの大冒険 1-1</title>
<style>
  :root{
    --sky-top:#5c94fc; --sky-bottom:#a8d8ff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --sky-top:#1a2a4a; --sky-bottom:#3a5580; }
  }
  :root[data-theme="dark"]{ --sky-top:#1a2a4a; --sky-bottom:#3a5580; }
  html,body{height:100%;margin:0;background:#000;overflow:hidden;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Trebuchet MS',sans-serif;touch-action:none;}
  #wrap{position:relative;width:100%;max-width:800px;aspect-ratio:800/480;}
  canvas{width:100%;height:100%;display:block;background:linear-gradient(var(--sky-top),var(--sky-bottom));
    image-rendering:pixelated;border-radius:6px;}
  #hud{position:absolute;top:8px;left:12px;color:#fff;font-weight:bold;font-size:18px;
    text-shadow:2px 2px 0 #000;pointer-events:none;}
  #msg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);
    color:#fff;text-shadow:2px 2px 0 #000;font-size:28px;text-align:center;pointer-events:none;display:none;}
  #controls{position:absolute;top:46px;left:0;right:0;display:flex;justify-content:space-between;
    padding:0 12px;pointer-events:none;}
  .pad{display:flex;gap:8px;pointer-events:auto;}
  .btn{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.35);
    border:2px solid rgba(255,255,255,0.6);color:#fff;font-size:20px;display:flex;
    align-items:center;justify-content:center;user-select:none;}
  #restartBtn{position:absolute;bottom:14px;right:14px;pointer-events:auto;
    background:#ffb703;border:none;border-radius:8px;padding:6px 12px;font-weight:bold;display:none;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="800" height="480"></canvas>
  <div id="hud">🐣 x <span id="lives">3</span> &nbsp; 距離: <span id="dist">0</span>%</div>
  <div id="msg"></div>
  <button id="restartBtn">もう一度 (R)</button>
  <div id="controls">
    <div class="pad">
      <div class="btn" id="btnL">◀</div>
      <div class="btn" id="btnR">▶</div>
    </div>
    <div class="pad">
      <div class="btn" id="btnJ">⤒</div>
    </div>
  </div>
</div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const TILE=40, GY=400, WORLD=4200;
const pits=[[1160,1240],[1960,2060],[3080,3200]];
const pipes=[{x:600,w:60,h:70},{x:1560,w:60,h:100},{x:2600,w:60,h:90},{x:3480,w:60,h:60}];
const plats=[{x:820,y:290,w:160,h:20},{x:1320,y:250,w:120,h:20},
  {x:2200,y:300,w:180,h:20},{x:2860,y:260,w:140,h:20},{x:3620,y:300,w:140,h:20}];
function inPit(x){return pits.some(p=>x>=p[0]&&x<p[1]);}
const enemies=[400,860,1420,1760,2260,2760,3020,3560].map(x=>({x,x0:x-70,x1:x+70,dir:1,alive:true,y:GY-24}));
let player,cam=0,lives=3,keys={},dist=0,state='play';

function reset(){
  player={x:60,y:GY-40,w:28,h:32,vx:0,vy:0,onGround:false,facing:1,dead:false,anim:0};
  enemies.forEach(e=>{e.alive=true;e.dir=1;});
  cam=0;state='play';
  document.getElementById('msg').style.display='none';
  document.getElementById('restartBtn').style.display='none';
}
function loseLife(){
  lives--; document.getElementById('lives').textContent=lives;
  if(lives<=0){ state='over'; showMsg('ゲームオーバー'); }
  else { player.x=Math.max(60,player.x-200); player.y=GY-40; player.vx=0; player.vy=0; }
}
function showMsg(t){
  const m=document.getElementById('msg'); m.textContent=t; m.style.display='block';
  document.getElementById('restartBtn').style.display='block';
}
function win(){ state='win'; showMsg('ゴール！🏠'); }

document.addEventListener('keydown',e=>{keys[e.key]=true;
  if((e.key==='r'||e.key==='R')&&(state==='over'||state==='win')){
    lives=3; document.getElementById('lives').textContent=3; reset();
  }
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});
function bindBtn(id,key){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();keys[key]=true;};
  const off=e=>{e.preventDefault();keys[key]=false;};
  el.addEventListener('touchstart',on);el.addEventListener('mousedown',on);
  el.addEventListener('touchend',off);el.addEventListener('mouseup',off);el.addEventListener('mouseleave',off);
}
bindBtn('btnL','ArrowLeft');bindBtn('btnR','ArrowRight');bindBtn('btnJ','ArrowUp');
document.getElementById('restartBtn').addEventListener('click',()=>{lives=3;document.getElementById('lives').textContent=3;reset();});

function groundYAt(x){ return inPit(x)? 9999 : GY; }

function update(){
  if(state!=='play') return;
  const p=player;
  const speed=3.2;
  if(keys['ArrowLeft']||keys['a']||keys['A']){p.vx=-speed;p.facing=-1;}
  else if(keys['ArrowRight']||keys['d']||keys['D']){p.vx=speed;p.facing=1;}
  else p.vx*=0.7;
  if((keys['ArrowUp']||keys[' ']||keys['w'])&&p.onGround){p.vy=-14.25;p.onGround=false;}
  p.vy+=0.45; if(p.vy>12)p.vy=12;
  p.x+=p.vx; p.y+=p.vy;
  if(p.x<10)p.x=10;
  p.onGround=false;
  // platforms
  plats.forEach(pl=>{
    if(p.x+p.w>pl.x&&p.x<pl.x+pl.w&&p.y+p.h>pl.y&&p.y+p.h-p.vy<=pl.y+2&&p.vy>=0){
      p.y=pl.y-p.h; p.vy=0; p.onGround=true;
    }
  });
  // pipes (solid box, land on top or blocked from side)
  pipes.forEach(pi=>{
    const topY=GY-pi.h;
    if(p.x+p.w>pi.x&&p.x<pi.x+pi.w){
      if(p.y+p.h>topY&&p.y+p.h-p.vy<=topY+2&&p.vy>=0){p.y=topY-p.h;p.vy=0;p.onGround=true;}
      else if(p.y+p.h>topY&&p.y<topY+pi.h){
        if(p.vx>0)p.x=pi.x-p.w; else if(p.vx<0)p.x=pi.x+pi.w; p.vx=0;
      }
    }
  });
  // ground / pit
  const gy=groundYAt(p.x+p.w/2);
  if(p.y+p.h>=gy && p.vy>=0 && !inPit(p.x+p.w/2)){ p.y=gy-p.h; p.vy=0; p.onGround=true; }
  if(p.y>560){ loseLife(); return; }
  // enemies
  enemies.forEach(e=>{
    if(!e.alive)return;
    e.x+=e.dir*1.1; if(e.x<e.x0)e.dir=1; if(e.x>e.x1)e.dir=-1;
    pipes.forEach(pi=>{
      if(e.x+14>pi.x&&e.x-14<pi.x+pi.w){
        if(e.dir>0){e.x=pi.x-14;e.dir=-1;} else {e.x=pi.x+pi.w+14;e.dir=1;}
      }
    });
    if(p.x<e.x+22&&p.x+p.w>e.x-22&&p.y+p.h>e.y&&p.y<e.y+24){
      if(p.vy>0 && p.y+p.h-p.vy<=e.y+6){ e.alive=false; p.vy=-6.5; }
      else { loseLife(); }
    }
  });
  dist=Math.min(100,Math.round((p.x/WORLD)*100));
  document.getElementById('dist').textContent=dist;
  cam=Math.max(0,Math.min(WORLD-800,p.x-300));
  if(p.x>WORLD-90) win();
}

function drawChick(p){
  const sx=p.x-cam, sy=p.y;
  ctx.save(); ctx.translate(sx+p.w/2,sy+p.h/2); ctx.scale(p.facing,1);
  ctx.fillStyle='#ffd43b';
  ctx.beginPath(); ctx.ellipse(0,4,13,15,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(6,-10,9,0,7); ctx.fill();
  ctx.fillStyle='#ff922b';
  ctx.beginPath(); ctx.moveTo(13,-10); ctx.lineTo(22,-7); ctx.lineTo(13,-5); ctx.fill();
  ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(9,-12,1.6,0,7); ctx.fill();
  ctx.fillStyle='#ff922b';
  ctx.fillRect(-6,14,5,6); ctx.fillRect(3,14,5,6);
  ctx.restore();
}
function drawEnemy(e){
  const sx=e.x-cam;
  if(sx<-40||sx>840)return;
  ctx.fillStyle='#8d5524';
  ctx.beginPath(); ctx.ellipse(sx,e.y+12,14,12,0,0,7); ctx.fill();
  ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(sx-5,e.y+8,2,0,7); ctx.arc(sx+5,e.y+8,2,0,7); ctx.fill();
}

function draw(){
  ctx.clearRect(0,0,800,480);
  // clouds
  ctx.fillStyle='rgba(255,255,255,0.85)';
  for(let i=0;i<6;i++){
    const cx=((i*500)-cam*0.3)%1000-100;
    ctx.beginPath(); ctx.ellipse(cx,60+((i%3)*20),30,16,0,0,7);
    ctx.ellipse(cx+25,55+((i%3)*20),22,14,0,0,7); ctx.fill();
  }
  // ground
  for(let x=0;x<WORLD;x+=TILE){
    const sx=x-cam; if(sx<-TILE||sx>840)continue;
    if(!inPit(x+TILE/2)){
      ctx.fillStyle='#c07a3e'; ctx.fillRect(sx,GY,TILE,480-GY);
      ctx.fillStyle='#5cb85c'; ctx.fillRect(sx,GY,TILE,10);
    }
  }
  // pipes
  pipes.forEach(pi=>{
    const sx=pi.x-cam; if(sx<-100||sx>900)return;
    ctx.fillStyle='#2f9e44'; ctx.fillRect(sx,GY-pi.h,pi.w,pi.h);
    ctx.fillStyle='#37b24d'; ctx.fillRect(sx-4,GY-pi.h,pi.w+8,14);
  });
  // platforms
  plats.forEach(pl=>{
    const sx=pl.x-cam; if(sx<-200||sx>900)return;
    ctx.fillStyle='#e8a13a'; ctx.fillRect(sx,pl.y,pl.w,pl.h);
    ctx.fillStyle='#c9852a'; ctx.fillRect(sx,pl.y,pl.w,4);
  });
  enemies.forEach(e=>{if(e.alive)drawEnemy(e);});
  drawChick(player);
  // nest goal
  const gx=WORLD-40-cam;
  if(gx>-100&&gx<900){
    ctx.fillStyle='#a0522d';
    ctx.beginPath(); ctx.ellipse(gx,GY-6,34,16,0,0,7); ctx.fill();
    ctx.strokeStyle='#7a3b16'; ctx.lineWidth=3;
    for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(gx-24+i*12,GY-6,10,Math.PI,2*Math.PI);ctx.stroke();}
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(gx-6,GY-14,6,7,0,0,7); ctx.ellipse(gx+8,GY-16,6,7,0,0,7); ctx.fill();
  }
}
function loop(){ update(); draw(); requestAnimationFrame(loop); }
reset(); loop();
</script>
</body>
</html>
